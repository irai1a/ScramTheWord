name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'flutter_migration/**'
      - '.github/workflows/build_flutter.yml'

jobs:
  build-apk:
    name: Build Flutter Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: flutter_migration
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_migration
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whack-A-Word-Ham-Flutter-APK
          path: flutter_migration/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
