name: Build Android APK & AAB

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK and AAB packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Build APK and AAB with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug; buildozer android release
          buildozer_version: stable

      - name: Upload Android Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Whack-A-Word-Ham-Binaries
          path: bin/*
          retention-days: 14
