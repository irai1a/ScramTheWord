name: Build Android APK & AAB

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK and AAB packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer Project Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-project-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ccache \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0" buildozer virtualenv

      - name: Pre-cache OpenSSL packages from GitHub Releases
        run: |
          mkdir -p ~/.buildozer/android/packages/openssl
          curl -fsSL -o ~/.buildozer/android/packages/openssl/openssl-3.3.1.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz
          touch ~/.buildozer/android/packages/openssl/.mark-openssl-3.3.1.tar.gz
          curl -fsSL -o ~/.buildozer/android/packages/openssl/openssl-3.0.12.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.0.12/openssl-3.0.12.tar.gz
          touch ~/.buildozer/android/packages/openssl/.mark-openssl-3.0.12.tar.gz
          curl -fsSL -o ~/.buildozer/android/packages/openssl/openssl-1.1.1w.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          touch ~/.buildozer/android/packages/openssl/.mark-openssl-1.1.1w.tar.gz

      - name: Build Debug APK
        run: |
          buildozer -v android debug

      - name: Build Release AAB (Android App Bundle)
        run: |
          buildozer -v android release

      - name: List Generated Binaries
        if: always()
        run: |
          ls -lah bin/ || true

      - name: Upload Android Binaries as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Whack-A-Word-Ham-Binaries
          path: bin/*
          retention-days: 14
