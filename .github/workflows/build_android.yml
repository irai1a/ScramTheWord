name: Build Android APK & AAB

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK and AAB packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer Project Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-project-

      - name: Install System Dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ccache \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0" buildozer virtualenv

      - name: Pre-cache OpenSSL packages from GitHub Releases
        run: |
          mkdir -p ~/.buildozer/android/packages/openssl
          curl -fsSL -o ~/.buildozer/android/packages/openssl/openssl-3.3.1.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz
          touch ~/.buildozer/android/packages/openssl/.mark-openssl-3.3.1.tar.gz
          curl -fsSL -o ~/.buildozer/android/packages/openssl/openssl-3.0.12.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.0.12/openssl-3.0.12.tar.gz
          touch ~/.buildozer/android/packages/openssl/.mark-openssl-3.0.12.tar.gz
          curl -fsSL -o ~/.buildozer/android/packages/openssl/openssl-1.1.1w.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          touch ~/.buildozer/android/packages/openssl/.mark-openssl-1.1.1w.tar.gz

      - name: Enforce Android Target API 36
        run: |
          echo "=== Enforcing Android API 36 across all build configurations ==="
          # Update any existing project.properties in caches
          find . -name "project.properties" -exec sed -i 's/target=android-[0-9]\+/target=android-36/g' {} + || true
          find ~/.buildozer -name "project.properties" -exec sed -i 's/target=android-[0-9]\+/target=android-36/g' {} + || true

          # Update any existing build.gradle in caches
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 36/g' {} + || true
          find ~/.buildozer -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/g' {} + || true
          find ~/.buildozer -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 36/g' {} + || true

          # Patch build.tmpl.gradle across system and packages
          find . -name "build.tmpl.gradle" -exec sed -i 's/compileSdkVersion {{ android_api }}/compileSdkVersion 36/g' {} + || true
          find . -name "build.tmpl.gradle" -exec sed -i 's/targetSdkVersion {{ android_api }}/targetSdkVersion 36/g' {} + || true
          find ~/.buildozer -name "build.tmpl.gradle" -exec sed -i 's/compileSdkVersion {{ android_api }}/compileSdkVersion 36/g' {} + || true
          find ~/.buildozer -name "build.tmpl.gradle" -exec sed -i 's/targetSdkVersion {{ android_api }}/targetSdkVersion 36/g' {} + || true
          find ~/.local -name "build.tmpl.gradle" -exec sed -i 's/compileSdkVersion {{ android_api }}/compileSdkVersion 36/g' {} + || true
          find ~/.local -name "build.tmpl.gradle" -exec sed -i 's/targetSdkVersion {{ android_api }}/targetSdkVersion 36/g' {} + || true
          find /opt/hostedtoolcache -name "build.tmpl.gradle" -exec sed -i 's/compileSdkVersion {{ android_api }}/compileSdkVersion 36/g' {} + || true
          find /opt/hostedtoolcache -name "build.tmpl.gradle" -exec sed -i 's/targetSdkVersion {{ android_api }}/targetSdkVersion 36/g' {} + || true

      - name: Build Debug APK
        run: |
          buildozer -v android debug

      - name: Re-enforce Android Target API 36 Before Release Packaging
        run: |
          find . -name "project.properties" -exec sed -i 's/target=android-[0-9]\+/target=android-36/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 36/g' {} + || true

      - name: Build Release AAB (Android App Bundle)
        run: |
          buildozer -v android release

      - name: Sign Release AAB (Android App Bundle)
        run: |
          for aab in bin/*-release.aab; do
            if [ -f "$aab" ]; then
              echo "Signing $aab with release keystore..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore keystore/whackawordham-release.keystore \
                -storepass "WhackWordHam2026!Key" \
                -keypass "WhackWordHam2026!Key" \
                "$aab" whackawordham
              jarsigner -verify "$aab"
            fi
          done

      - name: Verify Target API in Generated AAB
        run: |
          python -c "
          import zipfile, re, sys, glob
          aabs = [f for f in glob.glob('bin/*-release.aab') if 'whackawordham' in f]
          if not aabs:
              print('ERROR: No release AAB found in bin/!')
              sys.exit(1)
          aab_path = sorted(aabs)[-1]
          print(f'Inspecting generated bundle: {aab_path}...')
          with zipfile.ZipFile(aab_path) as z:
              manifest = z.read('base/manifest/AndroidManifest.xml')
              m = re.search(rb'targetSdkVersion\x1a\x02(\d+)', manifest)
              if not m:
                  m = re.search(rb'targetSdkVersion[^\d]*(\d{2})', manifest)
              if not m:
                  print('ERROR: targetSdkVersion not found in AAB manifest!')
                  sys.exit(1)
              target_sdk = m.group(1).decode()
              print(f'Verified AAB targetSdkVersion: {target_sdk}')
              if int(target_sdk) < 36:
                  print(f'ERROR: targetSdkVersion is {target_sdk}, which is below required API 36!')
                  sys.exit(1)
              print('SUCCESS: Target API level is verified to be 36 or higher!')
          "

      - name: List Generated Binaries
        if: always()
        run: |
          ls -lah bin/ || true

      - name: Upload Android Binaries as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Whack-A-Word-Ham-Binaries
          path: bin/*
          retention-days: 14
