name: whack_a_word_ham
description: "Whack-A-Word-Ham: Cozy woodland word scramble puzzle game built with Flutter & Flame."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Core Game Engine
  flame: ^1.18.0
  flame_audio: ^2.1.6

  # UI & Typography
  google_fonts: ^6.2.1

  # Utility & Persistence
  shared_preferences: ^2.2.3

  # Advertisements
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/words.json

